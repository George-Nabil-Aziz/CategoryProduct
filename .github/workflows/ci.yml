name: CI

on:
  push:
  pull_request:

env:
  # Test-only password for the ephemeral SQL Server service container. Not a secret:
  # the container lives only for the duration of the CI job and is never reachable from outside.
  # Keep in sync with jobs.sqlserver-tests.services.sqlserver.env.MSSQL_SA_PASSWORD
  # (the env context is not available inside services.<id>.env).
  SQLSERVER_CI_SA_PASSWORD: Ci-Only_Sa-Pass-1234

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CategoryProduct.slnx
      - run: dotnet build CategoryProduct.slnx -c Release --no-restore
      - run: dotnet test CategoryProduct.slnx -c Release --no-build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f CategoryProduct.API/Dockerfile -t categoryproduct-api:ci .
      - run: docker build -f CategoryProduct.MVC/Dockerfile -t categoryproduct-mvc:ci .

  sqlserver-tests:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Fake, CI-only value (see the workflow-level env above); not a real credential.
          MSSQL_SA_PASSWORD: Ci-Only_Sa-Pass-1234
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CategoryProduct.API.SqlServerTests -c Release
        env:
          SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=${{ env.SQLSERVER_CI_SA_PASSWORD }};TrustServerCertificate=True;
