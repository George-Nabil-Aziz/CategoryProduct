name: CI

on:
  push:
  pull_request:

env:
  # Test-only password for the ephemeral SQL Server service container. Not a secret:
  # the container lives only for the duration of the CI job and is never reachable from outside.
  # Keep in sync with jobs.sqlserver-tests.services.sqlserver.env.MSSQL_SA_PASSWORD
  # (the env context is not available inside services.<id>.env).
  SQLSERVER_CI_SA_PASSWORD: Ci-Only_Sa-Pass-1234

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CategoryProduct.slnx
      - run: dotnet build CategoryProduct.slnx -c Release --no-restore
      - run: dotnet test CategoryProduct.slnx -c Release --no-build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f CategoryProduct.API/Dockerfile -t categoryproduct-api:ci .
      - run: docker build -f CategoryProduct.MVC/Dockerfile -t categoryproduct-mvc:ci .

  sqlserver-tests:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Fake, CI-only value (see the workflow-level env above); not a real credential.
          MSSQL_SA_PASSWORD: Ci-Only_Sa-Pass-1234
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CategoryProduct.API.SqlServerTests -c Release
        env:
          SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=${{ env.SQLSERVER_CI_SA_PASSWORD }};TrustServerCertificate=True;

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway .env (random, CI-only, never committed)
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 12)-Aa1"
          JWT_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$SA_PASSWORD"
          echo "::add-mask::$JWT_KEY"
          {
            echo "SA_PASSWORD=$SA_PASSWORD"
            echo "JWT_KEY=$JWT_KEY"
            echo "API_HOST_PORT=5028"
            echo "MVC_HOST_PORT=5256"
            echo "LOW_STOCK_THRESHOLD=5"
          } > .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for API /health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 5 http://localhost:5028/health || true)
            if [ "$code" = "200" ]; then
              cat health.json; echo
              grep -q '"status":"Healthy"' health.json
              grep -q '"name":"database"' health.json
              exit 0
            fi
            echo "attempt $i: /health returned '$code'"; sleep 5
          done
          echo "API did not become healthy in time"; exit 1

      - name: Wait for MVC home page
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o home.html -w '%{http_code}' --max-time 10 http://localhost:5256/ || true)
            if [ "$code" = "200" ]; then
              grep -q 'CategoryProduct.MVC' home.html
              echo "MVC home OK"; exit 0
            fi
            echo "attempt $i: / returned '$code'"; sleep 5
          done
          echo "MVC did not serve the home page in time"; exit 1

      - name: Show compose state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env health.json home.html
