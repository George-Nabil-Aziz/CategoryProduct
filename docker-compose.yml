services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: CategoryProduct.API/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    environment:
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=CategoryProductDB;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};TrustServerCertificate=True;"
      Database__MigrateOnStartup: "true"
      Hosting__UseHttpsRedirection: "false"
      ProductImages__StoragePath: /data/product-images
      Inventory__LowStockThreshold: ${LOW_STOCK_THRESHOLD:-5}
      Bootstrap__AdminUserName: ${BOOTSTRAP_ADMIN_USERNAME:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      App__PublicMvcBaseUrl: ${APP_PUBLIC_MVC_BASE_URL:-http://localhost:${MVC_HOST_PORT:-5256}}
      PasswordReset__TokenMinutes: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Provider: ${EMAIL_PROVIDER:-Pickup}
      Email__From: ${EMAIL_FROM:-noreply@categoryproduct.local}
      Email__PickupDirectory: /data/email-outbox
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Smtp__UserName: ${EMAIL_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      Email__Smtp__EnableSsl: ${EMAIL_SMTP_ENABLESSL:-true}
    volumes:
      - productimages:/data/product-images
      - emailoutbox:/data/email-outbox
    ports:
      - "${API_HOST_PORT:-5028}:8080"

  mvc:
    build:
      context: .
      dockerfile: CategoryProduct.MVC/Dockerfile
    depends_on:
      api:
        condition: service_started
    environment:
      Api__BaseUrl: "http://api:8080/"
      Hosting__UseHttpsRedirection: "false"
      Cookie__SecurePolicy: "SameAsRequest"
      DataProtection__KeysPath: /data/dp-keys
    volumes:
      - mvckeys:/data/dp-keys
    ports:
      - "${MVC_HOST_PORT:-5256}:8080"

volumes:
  sqldata:
  productimages:
  emailoutbox:
  mvckeys:
